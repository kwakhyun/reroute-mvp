name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: file:./data/ci.db
  SESSION_PEPPER: ci-only-session-pepper-with-more-than-32-characters
  DEMO_MODE: "true"
  DEMO_RESET_ON_LOGIN: "false"
  ALLOW_FILE_DATABASE: "true"
  TRUST_PROXY_HEADERS: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm run analysis:verify
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:demo-reset
      - run: npm run build

  browser-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_USE_PRODUCTION: "true"
